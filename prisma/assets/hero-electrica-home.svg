  <path d="M0 780 C 380 700, 700 860, 1050 790 S 1500 700, 1600 760 V900 H0 Z" fill="#b45309" opacity="0.4"/>
  <path d="M0 830 C 420 770, 760 900, 1120 840 S 1520 770, 1600 820 V900 H0 Z" fill="#f59e0b" opacity="0.35"/>
