  <path d="M1330 330 C 1450 360, 1550 330, 1600 340" stroke="#e2e8f0" stroke-opacity="0.3" stroke-width="3" fill="none"/>
  <path d="M0 360 C 420 460, 820 300, 1165 345" stroke="#e2e8f0" stroke-opacity="0.2" stroke-width="3" fill="none"/>
