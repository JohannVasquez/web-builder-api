services:
  # Capa de borde. En local sirve para lo que no se puede simular de otro modo:
  # entrar por dominios propios sin puerto (http://acme.cl) igual que un
  # cliente. La web y la API corren en el host con `pnpm dev`, no aquí.
  proxy:
    image: caddy:2-alpine
    container_name: web-builder-proxy
    ports:
      - '80:80'
    volumes:
      - ../caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  db:
    image: postgres:16-alpine
    container_name: web-builder-db
    environment:
      POSTGRES_USER: webbuilder
      POSTGRES_PASSWORD: webbuilder
      POSTGRES_DB: web_builder
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: web-builder-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Sobreescribibles vía .env (MINIO_PORT / MINIO_CONSOLE_PORT) cuando otro
      # servicio local ya ocupa 9000; STORAGE_ENDPOINT debe calzar con el que uses.
      - '${MINIO_PORT:-9000}:9000' # API S3 (STORAGE_ENDPOINT)
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # Consola web
    volumes:
      - miniodata:/data

  # SMTP de desarrollo: recibe los correos del formulario de contacto y los
  # muestra en una web, sin mandar nada real. Puertos sobreescribibles vía
  # .env cuando otro mailpit local ya ocupa 1025/8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: web-builder-mailpit
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP (SMTP_HOST/SMTP_PORT de la API)
      - '${MAILPIT_UI_PORT:-8025}:8025' # UI web para ver los correos

  # Job de inicialización: solo crea el bucket. Se deja privado a propósito:
  # todo acceso de lectura pasa por una URL firmada (presigned) generada al
  # vuelo por la API, nunca por una política de lectura pública — así se
  # comporta igual que Cloudflare R2 en producción, donde el bucket también
  # es privado.
  minio-init:
    image: minio/mc:latest
    container_name: web-builder-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/web-builder-assets;
      mc anonymous set none local/web-builder-assets;
      "

volumes:
  pgdata:
  miniodata:
